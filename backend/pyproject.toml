[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "course-assistant-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "PyMySQL>=1.1,<2",
  "pydantic-settings>=2,<3", "PyJWT>=2.10,<3", "argon2-cffi>=23,<26",
  "python-multipart>=0.0.34,<1", "pypdf>=7.1,<8", "httpx>=0.28,<1"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the project's real SeekDB database"]
